name: pruebas e2e

# Condiciones de ejecución
on:
  pull_request:
    branches: [staging] # Se ejecuta solo cuando se haga un pull request en la rama staging

# Trabajos a ejecutarse
jobs: 
  test_e2e: # Nombres de los trabajos pueden ser distintos
    runs-on: ubuntu-latest # Donde corre
    steps: # Pasos a seguir
      - name: Cargar el codigo
        uses: actions/checkout@v7 # Toma un action del marketplace de github

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
        
      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores de playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar los tests
        run: npx playwright test

      - name: Generar reportes
        if: always() # También pueden haber condicionales
        uses: actions/upload-artifact@v7
        with: 
          name: reporte-testing
          path: playwright-report/
          retention-days: 3